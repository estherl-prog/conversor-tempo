<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Unidades de Tempo</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>⏱ TempoConvert</h1>
<p class="subtitulo">
    Converta segundos, minutos, horas, dias, semanas e anos em um clique.
</p>
    <p>Digite um valor</p>

    <input type="number" id="valor" placeholder="Ex: 120">

    <div class="conversao">

        <div>
            <label>De</label>

          <select id="origem">
    <option value="segundo">Segundos</option>
    <option value="minuto">Minutos</option>
    <option value="hora">Horas</option>
    <option value="dia">Dias</option>
    <option value="semana">Semanas</option>
</select>

        </div>

        <div>
            <label>Para</label>

            <select id="destino">
                <option value="segundo">Segundos</option>
                <option value="minuto">Minutos</option>
                <option value="hora">Horas</option>
                <option value="dia">Dias</option>
                <option value="semana">Semanas</option>
            </select>

        </div>

    </div>

    <button id="converter" onclick="converter()"
    >Converter
</button>

    <div id="resultado">

        O resultado aparecerá aqui.

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
